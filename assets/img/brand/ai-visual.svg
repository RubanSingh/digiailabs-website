<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-label="Illustration of an AI assistant, a model network and automation results">
  <defs>
    <linearGradient id="v-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38cdfb"/><stop offset=".45" stop-color="#2563eb"/><stop offset="1" stop-color="#8b3ff2"/>
    </linearGradient>
    <linearGradient id="v-gh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#8b3ff2"/>
    </linearGradient>
    <linearGradient id="v-soft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".16"/><stop offset="1" stop-color="#8b3ff2" stop-opacity=".16"/>
    </linearGradient>
    <filter id="v-sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#2a2f8f" flood-opacity=".18"/>
    </filter>
    <filter id="v-sh2" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#2a2f8f" flood-opacity=".16"/>
    </filter>
    <symbol id="v-mark" viewBox="0 0 24 24"><path d="M6 4h6.5a8 8 0 0 1 0 16H6z" fill="none" stroke="#fff" stroke-width="3.4" stroke-linejoin="round"/></symbol>
  </defs>

  <!-- main assistant window -->
  <g filter="url(#v-sh)">
    <rect x="120" y="58" width="400" height="318" rx="28" fill="#fff" fill-opacity=".92"/>
    <rect x="120.5" y="58.5" width="399" height="317" rx="27.5" fill="none" stroke="#fff"/>
  </g>
  <circle cx="148" cy="86" r="5" fill="#e3e6f2"/><circle cx="164" cy="86" r="5" fill="#e3e6f2"/><circle cx="180" cy="86" r="5" fill="#e3e6f2"/>
  <rect x="120" y="108" width="400" height="1" fill="#eceef6"/>

  <!-- prompt bubble -->
  <rect x="296" y="128" width="196" height="44" rx="16" fill="#f1f3fa"/>
  <rect x="314" y="144" width="120" height="7" rx="3.5" fill="#c9cfe2"/><rect x="314" y="157" width="80" height="7" rx="3.5" fill="#dadfee"/>

  <!-- AI answer -->
  <circle cx="160" cy="206" r="18" fill="url(#v-g)"/>
  <use href="#v-mark" x="151" y="197" width="18" height="18"/>
  <rect x="190" y="188" width="300" height="104" rx="18" fill="url(#v-soft)"/>
  <rect x="208" y="206" width="200" height="8" rx="4" fill="#5b5fe0" fill-opacity=".55"/>
  <rect x="208" y="222" width="250" height="8" rx="4" fill="#5b5fe0" fill-opacity=".35"/>
  <rect x="208" y="238" width="170" height="8" rx="4" fill="#5b5fe0" fill-opacity=".35"/>
  <rect x="208" y="258" width="74" height="20" rx="10" fill="#fff"/><rect x="290" y="258" width="92" height="20" rx="10" fill="#fff"/>
  <rect x="218" y="265" width="54" height="6" rx="3" fill="url(#v-gh)" fill-opacity=".8"/><rect x="300" y="265" width="72" height="6" rx="3" fill="url(#v-gh)" fill-opacity=".8"/>

  <!-- input bar -->
  <rect x="146" y="318" width="348" height="38" rx="19" fill="#f5f6fb" stroke="#e6e9f3"/>
  <rect x="166" y="334" width="150" height="7" rx="3.5" fill="#d3d8e8"/>
  <circle cx="474" cy="337" r="13" fill="url(#v-g)"/>
  <path d="M469 337h9m-4-4 4 4-4 4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- automation card (bottom left) -->
  <g filter="url(#v-sh2)">
    <rect x="28" y="286" width="190" height="136" rx="22" fill="#fff" fill-opacity=".95"/>
  </g>
  <rect x="48" y="306" width="70" height="7" rx="3.5" fill="#c9cfe2"/>
  <rect x="48" y="320" width="44" height="12" rx="6" fill="url(#v-gh)" fill-opacity=".9"/>
  <g fill="url(#v-g)">
    <rect x="52" y="378" width="16" height="26" rx="5" opacity=".45"/>
    <rect x="76" y="364" width="16" height="40" rx="5" opacity=".6"/>
    <rect x="100" y="370" width="16" height="34" rx="5" opacity=".7"/>
    <rect x="124" y="352" width="16" height="52" rx="5" opacity=".85"/>
    <rect x="148" y="340" width="16" height="64" rx="5"/>
    <rect x="172" y="346" width="16" height="58" rx="5" opacity=".9"/>
  </g>

  <!-- model network card (top right) -->
  <g filter="url(#v-sh2)">
    <rect x="452" y="20" width="168" height="132" rx="22" fill="#fff" fill-opacity=".95"/>
  </g>
  <g stroke="url(#v-gh)" stroke-width="2" stroke-linecap="round" opacity=".65">
    <path d="M486 60 L536 86 M486 112 L536 86 M536 86 L590 58 M536 86 L590 116 M486 60 L486 112"/>
  </g>
  <circle cx="486" cy="60" r="8" fill="#fff" stroke="url(#v-g)" stroke-width="3"/>
  <circle cx="486" cy="112" r="8" fill="#fff" stroke="url(#v-g)" stroke-width="3"/>
  <circle cx="590" cy="58" r="8" fill="#fff" stroke="url(#v-g)" stroke-width="3"/>
  <circle cx="590" cy="116" r="8" fill="#fff" stroke="url(#v-g)" stroke-width="3"/>
  <circle cx="536" cy="86" r="15" fill="url(#v-g)"/>
  <use href="#v-mark" x="528" y="78" width="16" height="16"/>

</svg>
